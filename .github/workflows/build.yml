name: WARLINK — Build manuel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Générer
        run: tools/premake5.exe vs2022
      - name: Compiler
        run: msbuild build/cb-launcher.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Préparer le paquet propre
        shell: pwsh
        run: ./scripts/prepare-release.ps1 -ZipOnly
      - uses: actions/upload-artifact@v4
        with:
          name: WARLINK-1.0.0-validation
          path: release/*.zip
# Aucun déclencheur push, aucun upload ou publication de release automatique.
